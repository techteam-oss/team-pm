name: Keep Supabase awake

# Supabase pauses free projects after 7 days without use (holidays, quiet weeks).
# A tiny read every day counts as use. It only uses the public key from .env, and
# row level security means it reads nothing.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          set -a; . ./.env; set +a
          code=$(curl -s -o /dev/null -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered $code"
          test "$code" = 200
